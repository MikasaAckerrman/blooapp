name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Барьер: чистая логика (модель + диагностика) проверяется без Android SDK.
  # Эти же тесты гоняются локально в среде разработки, поэтому красный CI здесь
  # означает реальную регрессию, а не разницу окружений.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Тесты core-model и core-diag
        run: ./gradlew :core-model:test :core-diag:test --stacktrace

      - name: Отчёты тестов артефактом
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: |
            core-model/build/reports/tests/
            core-diag/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  # Android-часть: юнит-тесты модуля :app и debug-APK.
  apk:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Есть ли модуль :app
        id: check
        run: |
          if [ -f app/build.gradle.kts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Модуль :app ещё не добавлен — сборка APK пропущена." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Тесты :app идут ДО сборки APK: собирать неработающее бессмысленно.
      - name: Юнит-тесты :app
        if: steps.check.outputs.present == 'true'
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: assembleDebug
        if: steps.check.outputs.present == 'true'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Сводка по всем тестам
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows, tot, fail = [], 0, 0
          patterns = [
              "*/build/test-results/test/*.xml",
              "*/build/test-results/testDebugUnitTest/*.xml",
          ]
          seen = set()
          for pat in patterns:
              for p in glob.glob(pat):
                  if p in seen:
                      continue
                  seen.add(p)
                  r = ET.parse(p).getroot()
                  n = int(r.get('tests', 0))
                  f = int(r.get('failures', 0)) + int(r.get('errors', 0))
                  rows.append((r.get('name'), n, f)); tot += n; fail += f
          print("## Тесты\n")
          if not rows:
              print("_нет результатов_")
          else:
              print("| класс | тестов | провалов |")
              print("|---|---:|---:|")
              for name, n, f in sorted(rows):
                  print(f"| {name} | {n} | {f} |")
              print(f"\n**Итого: {tot} тестов, {fail} провалов**")
          PY

      - name: Отчёты тестов :app артефактом
        if: always() && steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: APK артефактом
        if: steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blooapp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
