[versions]
# Версии сверены с maven.google.com / repo1.maven.org 28.08.2026.
agp        = "8.13.2"
kotlin     = "2.2.20"
coreKtx    = "1.19.0"
appcompat  = "1.7.1"
material   = "1.13.0"
recyclerview = "1.4.0"
coroutines = "1.11.0"
webkit     = "1.17.0"
room       = "2.8.4"
work       = "2.11.2"
browser    = "1.10.0"
lifecycle  = "2.9.4"
composeBom = "2026.08.00"
activity   = "1.13.0"
activityCompose = "1.13.0"
ksp        = "2.2.20-2.0.4"
jsoup      = "1.23.2"
junit      = "4.13.2"
truth      = "1.4.5"
