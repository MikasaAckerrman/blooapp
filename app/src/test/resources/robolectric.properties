# Версия Android, под которой исполняются Robolectric-тесты.
#
# Почему 34, а не targetSdk 36: образ android-all для SDK 36 (Baklava) требует
# JDK 21, а CI и локальная сборка идут на JDK 17 (минимум для AGP 8.13).
# Проверено по DefaultSdkProvider в Robolectric 4.16.1: SDK 34 -> JDK 17,
# SDK 36 -> JDK 21.
#
# Тесты, которые здесь исполняются, проверяют логику разбора ссылок и имён
# файлов — она не зависит от версии платформы. Всё, что зависит от поведения
# targetSdk 36 (edge-to-edge, predictive back, insets), проверяется на
# устройстве, а не в Robolectric: имитация тут дала бы ложную уверенность.
sdk=34
