# AndroidX обязателен: весь проект на нём (androidx.webkit, room, appcompat).
android.useAndroidX=true

# Память для Gradle и Kotlin-демона. 2 ГБ достаточно для этого проекта и
# укладывается в лимиты бесплатных раннеров GitHub Actions.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Параллельная сборка модулей и кеширование задач: у нас три модуля,
# два из которых независимы.
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin-компилятор в отдельном процессе — стабильнее на ограниченной памяти.
kotlin.daemon.jvmargs=-Xmx1536m

# R-класс без транзитивных ресурсов: быстрее сборка, явнее зависимости.
android.nonTransitiveRClass=true
